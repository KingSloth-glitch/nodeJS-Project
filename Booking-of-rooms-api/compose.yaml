services:
  mongodb:
    image: mongo:8.0
    container_name: booking-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: KingSloth
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
